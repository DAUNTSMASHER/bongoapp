version: '3.8'

services:
  web:
    build:
      context: .
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "5000:5000"
    volumes:
      - ./instance:/app/instance
    environment:
      FLASK_APP: app.py
      DATABASE_URI: sqlite:///instance/project_ideas.db
    command: ["flask", "run", "--host", "0.0.0.0"]
